[package]
name = "ncm-tui"
version = "0.1.2"
edition = "2024"

[dependencies]
aes = "0.8"
base64 = "0.22"
cbc = "0.1"
cipher = { version = "0.4", features = ["block-padding"] }
crossterm = "=0.28.1"
ecb = "0.1"
futures-util = "0.3"
hex = "0.4"
lofty = "=0.25.1"
md-5 = "0.10"
num-bigint = "0.4"
rand = "0.8"
qrcode = { version = "=0.14.1", default-features = false }
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["cookies", "json", "rustls-tls"] }
rodio = { version = "=0.21.1", default-features = false, features = ["playback"] }
symphonia = { version = "=0.5.5", default-features = false, features = ["aac", "flac", "isomp4", "mp3", "ogg", "pcm", "vorbis", "wav"] }
stream-download = { version = "=0.24.3", default-features = false, features = ["reqwest", "temp-storage"] }
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
toml = "0.9"
url = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
ratatui-image = { version = "8.0.1", default-features = false, features = ["crossterm"] }

[dev-dependencies]
tempfile = "3"
