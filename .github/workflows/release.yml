# Build prebuilt archives and attach them to a GitHub Release.
# The origin only hosts those archives plus install.sh — not this repo.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux audio headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test

  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            dist: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            dist: aarch64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
            dist: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux audio headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Package
        env:
          NCM_TUI_TARGET: ${{ matrix.target }}
          NCM_TUI_DIST_TARGET: ${{ matrix.dist }}
        run: sh scripts/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ncm-tui-${{ matrix.dist }}
          path: |
            dist/install.sh
            dist/latest
            dist/index.html
            dist/v*/ncm-tui-${{ matrix.dist }}.tar.gz
            dist/v*/sha256sums.txt

  package-fedora:
    needs: test
    runs-on: ubuntu-latest
    container: fedora:42
    timeout-minutes: 30

    steps:
      - name: Install build dependencies
        run: dnf install -y git gcc make alsa-lib-devel tar gzip findutils curl ca-certificates

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Package
        env:
          NCM_TUI_TARGET: x86_64-unknown-linux-gnu
          NCM_TUI_DIST_TARGET: x86_64-unknown-linux-fedora
        run: sh scripts/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ncm-tui-x86_64-unknown-linux-fedora
          path: |
            dist/install.sh
            dist/latest
            dist/index.html
            dist/v*/ncm-tui-x86_64-unknown-linux-fedora.tar.gz
            dist/v*/sha256sums.txt

  release:
    needs: [package, package-fedora]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten archives
        run: |
          set -eu
          mkdir -p upload
          find artifacts -type f \( -name '*.tar.gz' -o -name install.sh \) -exec cp {} upload/ \;
          find artifacts -name sha256sums.txt -exec cat {} + | awk 'NF' | sort -u > upload/sha256sums.txt
          ls -l upload

      - uses: softprops/action-gh-release@v2
        with:
          files: upload/*
          generate_release_notes: true
          fail_on_unmatched_files: true
