# Build prebuilt archives and attach them to a GitHub Release.
# The origin only hosts those archives plus install.sh — not this repo.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to sync to origin (skips build)
        required: false
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  test:
    if: github.event_name != 'workflow_dispatch' || inputs.tag == ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux audio headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test

  package:
    if: github.event_name != 'workflow_dispatch' || inputs.tag == ''
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            dist: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            dist: aarch64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
            dist: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux audio headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Package
        env:
          NCM_TUI_TARGET: ${{ matrix.target }}
          NCM_TUI_DIST_TARGET: ${{ matrix.dist }}
        run: sh scripts/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ncm-tui-${{ matrix.dist }}
          path: |
            dist/install.sh
            dist/latest
            dist/index.html
            dist/v*/ncm-tui-${{ matrix.dist }}.tar.gz
            dist/v*/sha256sums.txt

  package-fedora:
    if: github.event_name != 'workflow_dispatch' || inputs.tag == ''
    needs: test
    runs-on: ubuntu-latest
    container: fedora:42
    timeout-minutes: 30

    steps:
      - name: Install build dependencies
        run: dnf install -y git gcc make alsa-lib-devel tar gzip findutils curl ca-certificates

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Package
        env:
          NCM_TUI_TARGET: x86_64-unknown-linux-gnu
          NCM_TUI_DIST_TARGET: x86_64-unknown-linux-fedora
        run: sh scripts/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ncm-tui-x86_64-unknown-linux-fedora
          path: |
            dist/install.sh
            dist/latest
            dist/index.html
            dist/v*/ncm-tui-x86_64-unknown-linux-fedora.tar.gz
            dist/v*/sha256sums.txt

  release:
    needs: [package, package-fedora]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten archives
        run: |
          set -eu
          mkdir -p upload
          find artifacts -type f \( -name '*.tar.gz' -o -name install.sh \) -exec cp {} upload/ \;
          find artifacts -name sha256sums.txt -exec cat {} + | awk 'NF' | sort -u > upload/sha256sums.txt
          ls -l upload

      - uses: softprops/action-gh-release@v2
        with:
          files: upload/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  publish-origin:
    needs: [release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: |
      always() &&
      (needs.release.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.tag != ''))
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      VERSION: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: github-ncm-tui-origin

      - name: Pull release onto origin
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}"
          echo "Publishing ncm-tui ${VERSION} to origin"

          COMMAND_ID="$(
            aws ssm send-command \
              --region "$AWS_REGION" \
              --instance-ids "$INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --comment "ncm-tui origin sync ${VERSION}" \
              --parameters "commands=[\"/usr/local/bin/deploy-ncm-tui ${VERSION}\"]" \
              --query 'Command.CommandId' \
              --output text
          )"

          echo "SSM command ID: $COMMAND_ID"

          if ! aws ssm wait command-executed \
              --region "$AWS_REGION" \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID"; then
            aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --output json || true
            exit 1
          fi

          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json
